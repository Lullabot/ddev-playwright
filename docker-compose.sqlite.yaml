#ddev-generated
# Provide shared tmpfs storage for Playwright tooling. SQLite databases live
# below it, and ddev restart clears everything stored here.
services:
  web:
    volumes:
      - source: sqlite_database
        target: /tmp/ddev-playwright
        type: volume
      # Legacy mount for existing @lullabot/playwright-drupal versions.
      - source: sqlite_database
        target: /tmp/sqlite
        type: volume
volumes:
  sqlite_database:
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: mode=1777
