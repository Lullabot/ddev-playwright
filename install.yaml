name: ddev-playwright

# list of files and directories listed that are copied into project .ddev directory
# Each file should contain #ddev-generated so it can be replaced by a later `ddev get`
# if it hasn't been modified by the user.
# DDEV environment variables can be interpolated into these filenames
project_files:
  - commands/host/install-playwright
  - commands/web/playwright
  # The numeric prefixes are load-bearing. DDEV concatenates
  # web-build/Dockerfile.* in alphabetical order, and digits sort ahead of
  # letters, so these land before Dockerfile.playwright -- see the layer
  # ordering note in disabled.Dockerfile.playwright.
  - web-build/disabled.Dockerfile.playwright
  - web-build/Dockerfile.10-go-task
  - web-build/Dockerfile.20-astral-uv
  - web-build/install-task.sh
  - web-build/install-kasmvnc.sh
  - web-build/kasmvnc.yaml
  - web-build/xstartup
  - config.playwright.yml
  - docker-compose.sqlite.yaml
  - web-entrypoint.d/mkcert-nssdb.sh

# Manage .gitignore entries via post_install_actions so other addons (e.g.
# ddev-playwright-cli) can append their own entries without being overwritten.
post_install_actions:
  - |
    #ddev-description:Add ddev-playwright entries to web-build .gitignore
    GITIGNORE="${DDEV_APPROOT}/.ddev/web-build/.gitignore"
    touch "$GITIGNORE"
    if ! grep -qx "Dockerfile.playwright" "$GITIGNORE"; then
      printf '\n# This file is optionally copied to enable playwright from\n# disabled.Dockerfile.playwright.\nDockerfile.playwright\n' >> "$GITIGNORE"
    fi
    if ! grep -qx "playwright" "$GITIGNORE"; then
      printf '\n# This directory is always copied from PLAYWRIGHT_TEST_DIR (default test/playwright).\nplaywright\n' >> "$GITIGNORE"
    fi
  - |
    #ddev-description:Remove superseded ddev-playwright Dockerfiles
    # Dockerfile.task and Dockerfile.uv gained numeric prefixes so they sort
    # before Dockerfile.playwright. Upgrading leaves the old names behind, and
    # DDEV would build both copies -- installing go-task and uv twice per
    # build, the second time in exactly the slow position the rename exists to
    # avoid. Only remove files still carrying #ddev-generated, so a user who
    # has taken one over keeps it.
    for stale in Dockerfile.task Dockerfile.uv; do
      f="${DDEV_APPROOT}/.ddev/web-build/${stale}"
      if [ -f "$f" ] && grep -q "#ddev-generated" "$f"; then
        rm -f "$f"
      fi
    done

removal_actions:
- if grep "#ddev-generated" web-build/Dockerfile.playwright 2>/dev/null; then rm web-build/Dockerfile.playwright; fi
- |
  GITIGNORE="${DDEV_APPROOT}/.ddev/web-build/.gitignore"
  if [ -f "$GITIGNORE" ]; then
    sed -i '/# This file is optionally copied to enable playwright from$/d; /# disabled\.Dockerfile\.playwright\.$/d; /^Dockerfile\.playwright$/d; /# This directory is always copied from/d; /^playwright$/d' "$GITIGNORE"
  fi
