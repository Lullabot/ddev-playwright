#ddev-generated
hooks:
  pre-start:
    # If Playwright is enabled, make sure we get any changes, and bake in the
    # configured PLAYWRIGHT_TEST_DIR value. A plain Dockerfile has no way to
    # read a host env var at build time, so we substitute the real value into
    # Dockerfile.playwright here, on the host, before the build ever sees it.
    # That value has to land at the *exact* runtime path — see the
    # __PLAYWRIGHT_TEST_DIR__ comment in disabled.Dockerfile.playwright for
    # why a mismatch here silently defeats its browser-caching trick.
    - exec-host: |
        if [[ -f .ddev/web-build/Dockerfile.playwright ]]; then
          # Sourced in a subshell so only PLAYWRIGHT_TEST_DIR escapes here —
          # anything else .ddev/.env sets (PATH, etc.) doesn't leak into the
          # cp/sed/rm calls below.
          if [[ -f .ddev/.env ]]; then
            PLAYWRIGHT_TEST_DIR=$(set -a && . .ddev/.env && set +a && echo "$PLAYWRIGHT_TEST_DIR")
          fi
          PLAYWRIGHT_TEST_DIR="${PLAYWRIGHT_TEST_DIR:-test/playwright}"
          cp .ddev/web-build/disabled.Dockerfile.playwright .ddev/web-build/Dockerfile.playwright
          sed -i.bak "s|__PLAYWRIGHT_TEST_DIR__|${PLAYWRIGHT_TEST_DIR}|g" .ddev/web-build/Dockerfile.playwright
          rm -f .ddev/web-build/Dockerfile.playwright.bak
          rm -rf .ddev/web-build/playwright
          # Stage only the files a package manager reads to resolve and
          # install dependencies. Dockerfile.playwright bind-mounts this
          # directory into the build, so BuildKit hashes everything in it into
          # that layer's cache key -- and the layer deletes its copy of the
          # tree once the browsers are cached. Staging specs, fixtures, or
          # snapshots would therefore rebuild the web image, and every layer
          # after it, each time a test or a baseline screenshot changed,
          # without a single one of those bytes reaching the final image.
          #
          # The *.tgz entry covers local tarball dependencies. Since only this
          # directory is staged, a file: dependency has to resolve from within
          # PLAYWRIGHT_TEST_DIR -- one pointing outside it will not be there
          # to install.
          if [[ ! -f "${PLAYWRIGHT_TEST_DIR}/package.json" ]]; then
            echo "ddev-playwright: ${PLAYWRIGHT_TEST_DIR}/package.json is missing. Run 'ddev install-playwright' for setup instructions." >&2
            exit 1
          fi
          mkdir -p .ddev/web-build/playwright
          for src in "${PLAYWRIGHT_TEST_DIR}"/package.json \
            "${PLAYWRIGHT_TEST_DIR}"/package-lock.json \
            "${PLAYWRIGHT_TEST_DIR}"/npm-shrinkwrap.json \
            "${PLAYWRIGHT_TEST_DIR}"/yarn.lock \
            "${PLAYWRIGHT_TEST_DIR}"/.yarnrc.yml \
            "${PLAYWRIGHT_TEST_DIR}"/.yarn \
            "${PLAYWRIGHT_TEST_DIR}"/.npmrc \
            "${PLAYWRIGHT_TEST_DIR}"/*.tgz; do
            if [[ -e "$src" ]]; then
              cp -R "$src" .ddev/web-build/playwright/
            fi
          done
        fi
  post-start:
    # Clean up the playwright directory copied for builds.
    # We want to remove this otherwise future ddev get's will not copy in
    # changes to the web-build directory.
    - exec-host: rm -rf .ddev/web-build/playwright
web_environment:
  - DISPLAY=:1
  # Playwright's bundled Firefox reads enterprise policies from the file
  # referenced by this env var (see web-entrypoint.d/mkcert-nssdb.sh for
  # the writer). Keeps *.ddev.site trusted for Firefox without requiring
  # `ignoreHTTPSErrors: true`.
  - PLAYWRIGHT_FIREFOX_POLICIES_JSON=/tmp/playwright-firefox-policies.json
  # Where Playwright tests live relative to the project root. Override by
  # setting PLAYWRIGHT_TEST_DIR in .ddev/.env (e.g. PLAYWRIGHT_TEST_DIR=tests/playwright).
  - PLAYWRIGHT_TEST_DIR=${PLAYWRIGHT_TEST_DIR:-test/playwright}
# We add the sleep so this doesn't error out when not using playwright.
web_extra_daemons:
  - name: "kasmvnc"
    command: "kasmvncserver -fg || sleep infinity"
    directory: /var/www/html
web_extra_exposed_ports:
  - name: playwright
    container_port: 9323
    http_port: 8323
    https_port: 9324
  - name: kasmvnc
    container_port: 8444
    http_port: 8443
    https_port: 8444
